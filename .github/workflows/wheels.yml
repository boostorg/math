# The boost-math wheels (nanobind/): one abi3 wheel per platform, each tested, uploaded as artifacts.
# The cibuildwheel options are in nanobind/pyproject.toml.
name: Wheels
# Only after a merge (or by hand), to spare CI: include/ is in the paths because a header fix changes the wheel.
on:
  workflow_dispatch:
  push:
    branches: [ master, develop ]
    paths: [ 'include/**', 'nanobind/**', '.github/workflows/wheels.yml' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels:
    # ubuntu-24.04: manylinux x86_64; ubuntu-24.04-arm: manylinux aarch64.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025 ]
    steps:
      # Side by side, as nanobind/CMakeLists.txt expects; cibuildwheel copies the whole directory into its containers.
      - uses: actions/checkout@v6
        with:
          path: math
      - uses: actions/checkout@v6
        with:
          repository: boostorg/multiprecision
          ref: develop
          path: multiprecision
      - uses: actions/checkout@v6
        with:
          repository: boostorg/config
          ref: develop
          path: config
      - uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: math/nanobind
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
