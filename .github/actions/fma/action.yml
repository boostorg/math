#
# Fails unless the runner's CPU has fused multiply-add, then exports the compiler flags that let the
# compiler fuse a*b + c: CXXFLAGS and CUDAFLAGS for CMake, and FMA_B2 for b2 command lines.

name: FMA
description: Require FMA on the runner and export flags that use it
inputs:
  compiler:
    description: gcc (also MinGW), clang, msvc or clang-cl. The default is clang on macOS and gcc elsewhere.
    default: auto
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        compiler="${{ inputs.compiler }}"
        if [ "$compiler" = auto ]; then
          if [ "$RUNNER_OS" = macOS ]; then compiler=clang; else compiler=gcc; fi
        fi
        # No -ffp-contract: gcc and clang both contract a*b + c by default, and for clang
        # -ffp-contract=fast moves the fusion out of the front end, so less is fused at low optimization.
        #
        # -O1 because gcc never fuses at -O0. Even at -O1 it only does so with
        # -fexpensive-optimizations, which is what enables the pass that forms FMAs (otherwise -O2).
        # clang fuses within an expression at any level and rejects that flag.
        case "$compiler" in
          gcc) opt="-O1 -fexpensive-optimizations" ;;
          clang) opt="-O1" ;;
          *) opt="" ;;
        esac
        case "$(uname -m)" in
          x86_64|AMD64)
            if [ "$RUNNER_OS" = Windows ]; then
              has_fma=$(pwsh -NoProfile -Command '[System.Runtime.Intrinsics.X86.Fma]::IsSupported')
            elif [ "$RUNNER_OS" = macOS ]; then
              if sysctl -n machdep.cpu.leaf7_features machdep.cpu.features | grep -qw FMA; then has_fma=True; else has_fma=False; fi
            else
              if grep -qw fma /proc/cpuinfo; then has_fma=True; else has_fma=False; fi
            fi
            case "$compiler" in
              # MSVC has no switch for FMA alone: /arch:AVX2 is the lowest level that enables it.
              msvc) flags="/arch:AVX2 /fp:contract" ;;
              clang-cl) flags="-mfma" ;;
              *)
                flags="-mfma $opt"
                # MinGW: -mfma brings in AVX. Win64 only aligns the stack to 16 bytes, but gcc emits
                # aligned 32-byte AVX moves for stack objects, which crash (gcc bug 54412). Have the
                # assembler make them unaligned.
                # Only for b2: CXXFLAGS is also seen by bootstrap, which builds b2 with another compiler.
                if [ "$RUNNER_OS" = Windows ]; then b2_extra="cxxflags=-Wa,-muse-unaligned-vector-move"; fi
                ;;
            esac
            ;;
          arm64|aarch64)
            # Fused multiply-add is part of the base A64 instruction set, so no -m flag is needed:
            has_fma=True
            flags="$opt"
            ;;
          *)
            echo "::error::Unknown architecture $(uname -m)"
            exit 1
            ;;
        esac
        echo "FMA: $has_fma ($(uname -m)); compiler: $compiler; flags: $flags"
        if [ "$has_fma" != True ]; then
          echo "::error::This runner's CPU has no FMA"
          exit 1
        fi
        b2_flags="${b2_extra:-}"
        for f in $flags; do b2_flags="$b2_flags cxxflags=$f"; done
        echo "CXXFLAGS=$flags" >> "$GITHUB_ENV"
        if [ -n "$flags" ]; then echo "CUDAFLAGS=-Xcompiler=$(echo $flags | tr ' ' ',')" >> "$GITHUB_ENV"; fi
        echo "FMA_B2=$b2_flags" >> "$GITHUB_ENV"
