#
# Exports the compiler flags that make the compiler use fused multiply-add for a*b + c:
# CXXFLAGS and CUDAFLAGS for CMake, and FMA_B2 for b2 command lines.
#
# There is no check that the runner's CPU has FMA: a test run on one without it dies with an
# illegal instruction, which is failure enough.

name: FMA
description: Export compiler flags that use FMA
inputs:
  compiler:
    description: gnu (gcc, clang, MinGW), msvc, or clang-cl
    default: gnu
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        case "${{ inputs.compiler }}" in
          # MSVC has no switch for FMA alone: /arch:AVX2 is the lowest level that enables it.
          msvc) flags="/arch:AVX2 /fp:contract" ;;
          clang-cl) flags="-mfma" ;;
          *)
            # -O2 rather than b2's default of -O0: it is what users build with, and gcc does not
            # fuse below it. No -ffp-contract: gcc and clang both contract by default.
            flags="-O2"
            # FMA is in the base arm64 instruction set; x86 needs it switched on.
            case "$(uname -m)" in x86_64|AMD64) flags="-mfma $flags" ;; esac
            # MinGW: -mfma brings in AVX. Win64 only aligns the stack to 16 bytes, but gcc emits
            # aligned 32-byte AVX moves for stack objects, which crash (gcc bug 54412). Have the
            # assembler make them unaligned.
            # Only for b2: CXXFLAGS is also seen by bootstrap, which builds b2 with another compiler.
            if [ "$RUNNER_OS" = Windows ]; then b2_extra="cxxflags=-Wa,-muse-unaligned-vector-move"; fi
            ;;
        esac
        echo "FMA flags ($(uname -m)): $flags"
        b2_flags="${b2_extra:-}"
        for f in $flags; do b2_flags="$b2_flags cxxflags=$f"; done
        echo "CXXFLAGS=$flags" >> "$GITHUB_ENV"
        echo "CUDAFLAGS=-Xcompiler=$(echo $flags | tr ' ' ',')" >> "$GITHUB_ENV"
        echo "FMA_B2=$b2_flags" >> "$GITHUB_ENV"
