#
# TEMPORARY, for diagnosing the FMA failures: turns the failed tests of a job into error annotations,
# which are readable from the checks API without downloading the job log.

name: Report failed tests
description: Emit an error annotation for each failed test
inputs:
  kind:
    description: b2 or ctest
    default: b2
  dir:
    description: boost-root for b2, the CMake build directory for ctest
    default: ../boost-root
  target:
    description: CMake target to rebuild to recover compile errors when no test was run
    default: tests
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cd "${{ inputs.dir }}" || exit 0
        esc() { cut -c1-240 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
        pat='error|exceeds|ULP distance|Expected|Computed|EXIT STATUS|what\(\)|Assertion|unknown location|signal|terminate|Segmentation|FAILED|\*\*\*'
        n=0; names=""
        if [ "${{ inputs.kind }}" = b2 ]; then
          while IFS= read -r f; do
            [ -e "${f%.output}.run" ] && continue
            t=$(basename "${f%.output}"); names="$names $t"; n=$((n+1))
            if [ $n -le 8 ]; then echo "::error title=FAILED $t::$(grep -a -m 10 -iE "$pat" "$f" | esc)"; fi
          done < <(find bin.v2/libs/math -name '*.output' 2>/dev/null | sort)
        else
          if [ -f Testing/Temporary/LastTestsFailed.log ]; then
            while IFS= read -r line; do
              t=${line#*:}; names="$names $t"; n=$((n+1))
              if [ $n -le 8 ]; then
                out=$(awk -v t="$t" '$0 ~ "^[0-9]+/[0-9]+ Test: " t "$" {f=1} f {print} f && /^Test (Passed|Failed)/ {exit}' Testing/Temporary/LastTest.log | grep -a -m 10 -iE "$pat" | esc)
                echo "::error title=FAILED $t::$out"
              fi
            done < Testing/Temporary/LastTestsFailed.log
          else
            echo "::error title=No test was run: build output::$(cmake --build . --target ${{ inputs.target }} 2>&1 | grep -a -m 14 -iE 'error|FAILED|undefined|cannot|fatal' | esc)"
          fi
        fi
        echo "::error title=Failed tests ($n)::$names"
